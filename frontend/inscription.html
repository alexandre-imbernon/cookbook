<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookbook - Inscription</title>
    <!-- Lien Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #FFF8E5;
        }

        .hero-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .hero-section {
            text-align: center;
            margin: 30px 0;
        }

        .hero-title {
            color: #536E52;
            font-weight: bold;
        }

        .card-body {
            background-color: #FFF8E5;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            color: #536E52;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-group label {
            color: #536E52;
        }

        .form-group input {
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #536E52;
        }

        .btn-primary {
            background-color: #536E52;
            border-color: #536E52;
        }

        .btn-primary:hover {
            background-color: #3e4d3a;
            border-color: #3e4d3a;
        }

        footer {
            background-color: #536E52;
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }

        footer a {
            color: #d4d4d4;
            text-decoration: none;
        }

        footer a:hover {
            color: white;
        }
    </style>
</head>
<body>

    <!-- HEADER NAVBAR -->
    <nav class="navbar navbar-expand-lg" style="background-color: #536E52;">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Cookbook</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Ajouter une recette</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Toutes les recettes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Favoris</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="connexion.html">Connexion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- SECTION FORMULAIRE -->
    <section class="hero-section">
        <h1 class="hero-title">Inscription</h1>
        <p>Créez un compte pour partager vos recettes et découvrir celles des autres.</p>
    </section>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <!-- Formulaire d'Inscription -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-body">
                        <form action="#" method="POST">
                            <div class="form-group mb-3">
                                <label for="new-email" class="form-label">Email</label>
                                <input type="email" id="new-email" class="form-control" placeholder="Entrez votre email" required>
                            </div>
                            <div class="form-group mb-3">
                                <label for="new-password" class="form-label">Mot de passe</label>
                                <input type="password" id="new-password" class="form-control" placeholder="Choisissez un mot de passe" required>
                            </div>
                            <div class="form-group mb-3">
                                <label for="confirm-password" class="form-label">Confirmer le mot de passe</label>
                                <input type="password" id="confirm-password" class="form-control" placeholder="Confirmez votre mot de passe" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Cookbook. Tous droits réservés.</p>
            <p>
                <a href="#">Politique de confidentialité</a> | 
                <a href="#">Mentions légales</a> | 
                <a href="#">Contact</a>
            </p>
        </div>
    </footer>

    <!-- Lien Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
