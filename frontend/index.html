<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookbook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #FFF8E5;
            
        }

        h1 {
            color: #536E52;
            text-align: center;
            margin-bottom: 30px;
        }

        #recipeForm, #editFormContainer {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 40px;
        }

        #recipeForm button,
        #editFormContainer button {
            background: #536E52;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #recipeForm button:hover,
        #editFormContainer button:hover {
            background: #536E52;
        }

        #recipes .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
            cursor: pointer;
        }

        #editFormContainer {
            display: none;
        }

        

    </style>
</head>
<body>

    <!-- HEADER NAVBAR -->
    <nav class="navbar navbar-expand-lg" style="background-color: #536E52;">
      <div class="container-fluid">
            <a class="navbar-brand" href="#">Cookbook</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="accueil.html">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Ajouter une recette</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="allrecette.html">Toutes les recettes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="favoris.html">Favoris</a>
                    </li>
                    <li class="nav-item dropdown">
                      <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                          <i class="fas fa-user"></i> <!-- Icône utilisateur -->
                      </a>
                      <ul class="dropdown-menu dropdown-menu-end">
                          <li><a class="dropdown-item" href="connexion.html">Connexion</a></li>
                          <li><a class="dropdown-item" href="inscription.html">Inscription</a></li>
                      </ul>
                  </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Cookbook - Ajoutez vos recettes</h1>

        <form id="recipeForm" class="mb-5">
            <div class="mb-3">
                <input type="text" class="form-control" name="title" placeholder="Titre de la recette" required />
            </div>
            <div class="mb-3">
                <textarea class="form-control" name="description" placeholder="Description" required></textarea>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" name="ingredients" placeholder="Ingrédients (séparés par des virgules)" required />
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" name="steps" placeholder="Étapes (séparées par des virgules)" required />
            </div>
            <div class="mb-3">
                <input type="file" class="form-control" name="photo" accept="image/*" />
            </div>
            <button type="submit" class="btn btn-danger">Ajouter la recette</button>
        </form>

        <h1>Cookbook - Consultez toutes nos recettes</h1>

        <div id="recipes" class="row g-4"> <!-- g-4 ajoute un bel espacement -->
          <div class="col-md-6"> <!-- 2 cartes par ligne sur écran moyen et large -->
              <div class="card h-100 shadow-sm"> <!-- h-100 pour hauteur égale et shadow-sm pour un léger effet d'ombre -->
                  <img src="https://via.placeholder.com/300x300" 
                       class="card-img-top img-fluid" 
                       alt="Image recette" 
                       data-bs-toggle="modal" 
                       data-bs-target="#imageModal">
                  <div class="card-body">
                      <h5 class="card-title">Titre de la recette</h5>
                      <p class="card-text">Description de la recette...</p>
                      <button class="btn btn-primary">Modifier</button>
                      <button class="btn btn-danger">Supprimer</button>
                  </div>
              </div>
          </div>
      </div>
      

        <div id="editFormContainer" class="mt-5">
            <h2>Modifier la recette</h2>
            <form id="editRecipeForm">
                <input type="hidden" id="editRecipeId" />
                <div class="mb-3">
                    <label for="editTitle" class="form-label">Titre :</label>
                    <input type="text" class="form-control" id="editTitle" required />
                </div>
                <div class="mb-3">
                    <label for="editDescription" class="form-label">Description :</label>
                    <textarea class="form-control" id="editDescription" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="editIngredients" class="form-label">Ingrédients :</label>
                    <input type="text" class="form-control" id="editIngredients" required />
                </div>
                <div class="mb-3">
                    <label for="editSteps" class="form-label">Étapes :</label>
                    <input type="text" class="form-control" id="editSteps" required />
                </div>
                <button type="submit" class="btn btn-success">Mettre à jour</button>
                <button type="button" id="cancelEdit" class="btn btn-secondary">Annuler</button>
            </form>
        </div>
    </div>

    <!-- Modal pour l'affichage de l'image -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-body">
                    <img src="https://via.placeholder.com/600x400" class="img-fluid" alt="Image en grand">
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
