<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoris - Cookbook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .recipe-card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- HEADER NAVBAR -->
    <nav class="navbar navbar-expand-lg" style="background-color: #536E52;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Cookbook</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ajouter_recette.html">Ajouter une recette</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="favoris.html">Favoris</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- SECTION FAVORIS -->
    <div class="container mt-5">
        <h1>Recettes en favoris</h1>
        <div id="favoris-container" class="row">
            <!-- Les recettes favorites seront injectées ici -->
        </div>
    </div>

    <script>
        window.onload = function() {
            const favoris = JSON.parse(localStorage.getItem('favoris')) || [];
            const favorisContainer = document.getElementById('favoris-container');
            
            if (favoris.length > 0) {
                favoris.forEach(favori => {
                    const favoriElement = document.createElement('div');
                    favoriElement.className = 'col-md-4 recipe-card';
                    favoriElement.innerHTML = `
                        <div class="card">
                            <img src="http://localhost:3000/uploads/${favori.photo}" alt="${favori.title}" class="card-img-top">
                            <div class="card-body">
                                <h5 class="card-title">${favori.title}</h5>
                                <button class="remove-fav-btn btn btn-danger" data-id="${favori.id}">Retirer des favoris</button>
                            </div>
                        </div>
                    `;
                    favorisContainer.appendChild(favoriElement);

                    // Écouteur pour retirer un favori
                    const removeFavBtn = favoriElement.querySelector('.remove-fav-btn');
                    removeFavBtn.addEventListener('click', function() {
                        retirerFavoris(favori.id);
                    });
                });
            } else {
                favorisContainer.innerHTML = "<p>Vous n'avez pas encore de favoris.</p>";
            }
        };

        // Fonction pour retirer un favori
        function retirerFavoris(id) {
            let favoris = JSON.parse(localStorage.getItem('favoris')) || [];
            favoris = favoris.filter(fav => fav.id !== id);
            localStorage.setItem('favoris', JSON.stringify(favoris));
            alert('Recette retirée des favoris');
            window.location.reload();  // Recharger la page pour mettre à jour l'affichage
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
